[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sai-lora-ticket-classifier"
version = "0.1.0"
description = "LoRA ticket classifier: parameter-efficient model adaptation"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "transformers>=4.45,<6", "peft>=0.13,<1", "accelerate>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
aws = ["sagemaker>=2.240,<3", "boto3>=1.35,<2"]

[tool.setuptools.packages.find]
where = ["src"]
